version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: facultyflow
      POSTGRES_PASSWORD: password
      POSTGRES_DB: facultyflow_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facultyflow -d facultyflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://facultyflow:password@db:5432/facultyflow_db?schema=public
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_for_dev}
      - CLIENT_URL=http://localhost:3000
      - PORT=5000
      - AI_API_KEY=${AI_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
